#Configuracion perfil
#spring.profiles.active=test

# Config del servidor
server.port=8080

# Config de la base de datos SQLite
#spring.datasource.driver-class-name=org.sqlite.JDBC
#spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.datasource.url = jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}

spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Config JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Config especificaa para SQLite y Hibernate
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Config de Jackson para JSON
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Config de seguridad JWT
jwt.secret=${JWT_SECRET:local-development-jwt-secret-key-2026-minimum-length}
jwt.expiration=86400000

# Configuracion de aplicacion
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.bootstrap.create-default-admin=${APP_BOOTSTRAP_CREATE_DEFAULT_ADMIN:false}
app.bootstrap.default-admin.username=${APP_BOOTSTRAP_DEFAULT_ADMIN_USERNAME:}
app.bootstrap.default-admin.password=${APP_BOOTSTRAP_DEFAULT_ADMIN_PASSWORD:}
app.bootstrap.default-admin.email=${APP_BOOTSTRAP_DEFAULT_ADMIN_EMAIL:}

# Config del nivel de logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.com.veckos=INFO

server.error.whitelabel.enabled=false
